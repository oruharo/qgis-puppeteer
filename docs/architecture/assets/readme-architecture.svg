<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 540" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,3.5 L0,7 Z" fill="#546e7a"/>
    </marker>
  </defs>

  <!-- ===== Provided-by-this-project band (Apache-2.0 core) ===== -->
  <rect x="20" y="135" width="820" height="240" rx="14"
        fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.6" stroke-dasharray="7 5" opacity="0.55"/>
  <text x="36" y="156" font-size="12" font-weight="700" fill="#1b5e20">
    Provided by qgis-puppeteer  ·  Apache-2.0
  </text>
  <text x="36" y="172" font-size="10.5" fill="#33691e">
    pip install qgis-puppeteer  ·  pip install pytest-qgis-puppeteer
  </text>

  <!-- ===== Provided-by-this-project band (GPL-3.0 plugin) ===== -->
  <rect x="20" y="395" width="820" height="125" rx="14"
        fill="#ede7f6" stroke="#4a148c" stroke-width="1.6" stroke-dasharray="7 5" opacity="0.55"/>
  <text x="36" y="416" font-size="12" font-weight="700" fill="#4a148c">
    Provided by qgis-puppeteer  ·  qgis_puppet plugin (GPL-3.0-or-later)
  </text>
  <text x="36" y="431" font-size="10.5" fill="#6a1b9a">
    Installed inside QGIS via the Plugin Manager (one per QGIS instance)
  </text>

  <!-- ============ Top tier: external callers (NOT provided) ============ -->
  <g>
    <rect x="40" y="30" width="240" height="80" rx="8" fill="#fff" stroke="#1a73e8" stroke-width="1.8"/>
    <text x="160" y="58" text-anchor="middle" font-size="15" font-weight="700" fill="#1a73e8">Claude Desktop</text>
    <text x="160" y="78" text-anchor="middle" font-size="11" fill="#555">LLM agent (MCP client)</text>
    <text x="160" y="96" text-anchor="middle" font-size="10" fill="#888">— external —</text>

    <rect x="310" y="30" width="240" height="80" rx="8" fill="#fff" stroke="#c5221f" stroke-width="1.8"/>
    <text x="430" y="58" text-anchor="middle" font-size="15" font-weight="700" fill="#c5221f">pytest</text>
    <text x="430" y="78" text-anchor="middle" font-size="11" fill="#555">your test suite</text>
    <text x="430" y="96" text-anchor="middle" font-size="10" fill="#888">— external —</text>

    <rect x="580" y="30" width="240" height="80" rx="8" fill="#fff" stroke="#ef6c00" stroke-width="1.8"/>
    <text x="700" y="58" text-anchor="middle" font-size="15" font-weight="700" fill="#ef6c00">Your Python script</text>
    <text x="700" y="78" text-anchor="middle" font-size="11" fill="#555">any caller</text>
    <text x="700" y="96" text-anchor="middle" font-size="10" fill="#888">— external —</text>
  </g>

  <!-- ============ Mid tier: gateway / pytest plugin / client ============ -->
  <g>
    <rect x="40" y="195" width="240" height="80" rx="8" fill="#fffde7" stroke="#f9a825" stroke-width="2"/>
    <text x="160" y="222" text-anchor="middle" font-size="13" font-weight="700" fill="#a16800">MCP Gateway</text>
    <text x="160" y="240" text-anchor="middle" font-size="10.5" fill="#a16800">MCP (stdio) ⇄ WebSocket bridge</text>
    <text x="160" y="260" text-anchor="middle" font-size="10" fill="#a16800" font-family="ui-monospace, monospace">qgis_puppeteer.gateways.mcp</text>

    <rect x="310" y="195" width="240" height="80" rx="8" fill="#fce8e6" stroke="#c5221f" stroke-width="2"/>
    <text x="430" y="222" text-anchor="middle" font-size="13" font-weight="700" fill="#c5221f">pytest-qgis-puppeteer</text>
    <text x="430" y="240" text-anchor="middle" font-size="10.5" fill="#c5221f">fixtures, Locator, expect()</text>
    <text x="430" y="260" text-anchor="middle" font-size="10" fill="#c5221f" font-family="ui-monospace, monospace">pytest_qgis_puppeteer</text>

    <rect x="580" y="195" width="240" height="80" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
    <text x="700" y="222" text-anchor="middle" font-size="13" font-weight="700" fill="#0d47a1">AutomationClient</text>
    <text x="700" y="240" text-anchor="middle" font-size="10.5" fill="#0d47a1">WebSocket client / sync API</text>
    <text x="700" y="260" text-anchor="middle" font-size="10" fill="#0d47a1" font-family="ui-monospace, monospace">qgis_puppeteer.AutomationClient</text>
  </g>

  <!-- Caller -> mid arrows -->
  <g stroke="#546e7a" stroke-width="1.6" fill="none">
    <line x1="160" y1="110" x2="160" y2="193" marker-end="url(#arr)"/>
    <line x1="430" y1="110" x2="430" y2="193" marker-end="url(#arr)"/>
    <line x1="700" y1="110" x2="700" y2="193" marker-end="url(#arr)"/>
  </g>
  <text x="166" y="135" font-size="10" fill="#455a64">MCP (stdio)</text>
  <text x="436" y="135" font-size="10" fill="#455a64">runs / imports</text>
  <text x="706" y="135" font-size="10" fill="#455a64">imports</text>

  <!-- pytest-plugin uses AutomationClient internally -->
  <line x1="550" y1="235" x2="578" y2="235" stroke="#90a4ae" stroke-width="1.3" stroke-dasharray="3 3" fill="none" marker-end="url(#arr)"/>
  <text x="554" y="226" font-size="9" fill="#607d8b">uses</text>

  <!-- ============ Hub ============ -->
  <rect x="300" y="305" width="260" height="60" rx="10" fill="#c8e6c9" stroke="#1b5e20" stroke-width="2.5"/>
  <text x="430" y="332" text-anchor="middle" font-size="18" font-weight="700" fill="#1b5e20">Hub</text>
  <text x="430" y="354" text-anchor="middle" font-size="10.5" fill="#1b5e20">single port :9876 — routes by instance label</text>

  <!-- mid -> Hub arrows -->
  <g stroke="#546e7a" stroke-width="1.6" fill="none">
    <line x1="160" y1="275" x2="310" y2="305" marker-end="url(#arr)"/>
    <line x1="430" y1="275" x2="430" y2="303" marker-end="url(#arr)"/>
    <line x1="700" y1="275" x2="550" y2="305" marker-end="url(#arr)"/>
  </g>
  <text x="220" y="297" font-size="10" fill="#455a64" font-weight="600">WebSocket</text>
  <text x="595" y="297" font-size="10" fill="#455a64" font-weight="600">WebSocket</text>

  <!-- ============ Bottom: QGIS instances ============ -->
  <g>
    <!-- Outer = QGIS process (external), inner = qgis_puppet plugin (provided) -->
    <rect x="60" y="445" width="220" height="65" rx="8" fill="#fff" stroke="#9e9e9e" stroke-width="1.4" stroke-dasharray="4 3"/>
    <text x="170" y="466" text-anchor="middle" font-size="11" fill="#616161">QGIS process  (external)</text>
    <rect x="78" y="475" width="184" height="28" rx="6" fill="#ede7f6" stroke="#4a148c" stroke-width="1.6"/>
    <text x="170" y="494" text-anchor="middle" font-size="12" font-weight="700" fill="#4a148c">qgis_puppet  ·  label=A</text>

    <rect x="320" y="445" width="220" height="65" rx="8" fill="#fff" stroke="#9e9e9e" stroke-width="1.4" stroke-dasharray="4 3"/>
    <text x="430" y="466" text-anchor="middle" font-size="11" fill="#616161">QGIS process  (external)</text>
    <rect x="338" y="475" width="184" height="28" rx="6" fill="#ede7f6" stroke="#4a148c" stroke-width="1.6"/>
    <text x="430" y="494" text-anchor="middle" font-size="12" font-weight="700" fill="#4a148c">qgis_puppet  ·  label=B</text>

    <rect x="580" y="445" width="220" height="65" rx="8" fill="#fff" stroke="#bdbdbd" stroke-width="1.2" stroke-dasharray="5 4"/>
    <text x="690" y="478" text-anchor="middle" font-size="12" font-weight="600" fill="#757575">… more QGIS instances</text>
    <text x="690" y="495" text-anchor="middle" font-size="10" fill="#9e9e9e">multi-instance supported</text>
  </g>

  <!-- Hub <-> Worker arrows (bidirectional) -->
  <g stroke="#546e7a" stroke-width="1.6" fill="none">
    <line x1="330" y1="365" x2="200" y2="443" marker-end="url(#arr)"/>
    <line x1="430" y1="365" x2="430" y2="443" marker-end="url(#arr)"/>
    <line x1="530" y1="365" x2="660" y2="443" marker-end="url(#arr)"/>
  </g>
  <text x="370" y="408" font-size="10" fill="#455a64" font-weight="600">WebSocket (Worker dials Hub)</text>
</svg>
