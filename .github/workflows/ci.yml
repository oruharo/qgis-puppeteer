name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch: {}

# Cancel previous runs on the same ref / PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }} / py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]
    # Pin uv's target Python at the job level so `uv sync` and `uv run` both
    # resolve to the same env. Without this, `uv sync` builds a default-Python
    # env and `uv run --python <ver>` switches to an empty env at test time.
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Setup Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        # --all-packages installs every workspace member (qgis-puppeteer,
        # pytest-qgis-puppeteer) into the venv. Without it `uv sync` only
        # syncs the root project's deps + dev group, leaving the workspace
        # packages uninstalled — tests then fail to import qgis_puppeteer.
        run: uv sync --all-packages --all-extras --dev

      # Tests are split per package so failure attribution is clear in CI logs.
      # No real QGIS process is required.
      - name: Test qgis-puppeteer (core)
        run: uv run pytest packages/qgis-puppeteer/tests -q

      - name: Test pytest-qgis-puppeteer
        run: uv run pytest packages/pytest-qgis-puppeteer/tests -q

      - name: Plugin folder mirrors the library
        # plugins/qgis_puppeteer/ is the ready-to-copy QGIS plugin folder: the
        # plugin-owned files plus a committed copy of the library. The copy is
        # made by scripts/sync_plugin.py and must not drift.
        run: uv run python scripts/sync_plugin.py --check

      - name: Test QGIS Puppeteer plugin
        run: uv run pytest plugins/tests -q

      - name: Wheel leaves the QGIS plugin out
        # qgis_plugin/ is GPL-3.0-or-later and lives in plugins/qgis_puppeteer/.
        # The Apache-2.0 wheel must not carry it, and classFactory relies on
        # its absence to detect a pip copy that hides the plugin folder.
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: |
          uv build --package qgis-puppeteer --wheel --sdist -o build-check
          uv run python - <<'PY'
          import glob, tarfile, zipfile
          [whl] = glob.glob("build-check/*.whl")
          [sdist] = glob.glob("build-check/*.tar.gz")
          names = zipfile.ZipFile(whl).namelist() + tarfile.open(sdist).getnames()
          leaked = [n for n in names if "qgis_plugin" in n or n.endswith(("metadata.txt", "icon.png"))]
          assert not leaked, leaked
          assert any(n.endswith("qgis_puppeteer/hub.py") for n in names)
          print(f"ok: {whl}, {sdist}")
          PY

  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Setup Python
        run: uv python install 3.12

      - name: Install dependencies
        # --all-packages installs every workspace member (qgis-puppeteer,
        # pytest-qgis-puppeteer) into the venv. Without it `uv sync` only
        # syncs the root project's deps + dev group, leaving the workspace
        # packages uninstalled — tests then fail to import qgis_puppeteer.
        run: uv sync --all-packages --all-extras --dev

      - name: ruff check
        run: uv run ruff check packages plugins scripts

      - name: ruff format --check
        # ruff format baseline applied repo-wide; this is now a hard gate.
        run: uv run ruff format --check packages plugins scripts
