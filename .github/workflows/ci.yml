name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch: {}

# Cancel previous runs on the same ref / PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }} / py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]
    # Pin uv's target Python at the job level so `uv sync` and `uv run` both
    # resolve to the same env. Without this, `uv sync` builds a default-Python
    # env and `uv run --python <ver>` switches to an empty env at test time.
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Setup Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        # --all-packages installs every workspace member (qgis-puppeteer,
        # pytest-qgis-puppeteer) into the venv. Without it `uv sync` only
        # syncs the root project's deps + dev group, leaving the workspace
        # packages uninstalled — tests then fail to import qgis_puppeteer.
        run: uv sync --all-packages --all-extras --dev

      # No test suites exist yet, so this job only proves that the workspace
      # resolves and installs on every matrix cell. The per-package test steps
      # are added together with the first test suite.

  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Setup Python
        run: uv python install 3.12

      - name: Install dependencies
        # --all-packages installs every workspace member (qgis-puppeteer,
        # pytest-qgis-puppeteer) into the venv. Without it `uv sync` only
        # syncs the root project's deps + dev group, leaving the workspace
        # packages uninstalled — tests then fail to import qgis_puppeteer.
        run: uv sync --all-packages --all-extras --dev

      - name: ruff check
        run: uv run ruff check packages plugins

      - name: ruff format --check
        # ruff format baseline applied repo-wide; this is now a hard gate.
        run: uv run ruff format --check packages plugins
